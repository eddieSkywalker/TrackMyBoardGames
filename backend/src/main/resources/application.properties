spring.application.name=trackmyboardgames

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trackmyboardgames}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-i640yykn7qf8bmaw.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://trackmyboardgames-api}

# Uploaded pictures can be up to 5 MB (the app also checks this); the request limit leaves room for form overhead.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
