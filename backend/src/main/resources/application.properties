spring.application.name=trackmyboardgames

# Comma-separated frontend origins; override in Beanstalk for the hosted frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trackmyboardgames}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate

# OAuth2 Resource Server configuration (Auth0)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-i640yykn7qf8bmaw.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://trackmyboardgames-api}

# RabbitMQ is opt-in until a separate CloudAMQP instance is configured.
app.messaging.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
app.messaging.rabbitmq.uri=${RABBITMQ_URI:}
# Opt in separately: the receiver starts handling queued events as soon as the backend starts.
app.messaging.rabbitmq.consumer-enabled=${RABBITMQ_CONSUMER_ENABLED:false}
# Check the outbox once a minute by default; increase or decrease this with RABBITMQ_POLL_INTERVAL_MS if needed.
app.messaging.rabbitmq.poll-interval-ms=${RABBITMQ_POLL_INTERVAL_MS:60000}

# One-time startup calculation for existing collections; turn off again after a successful run.
app.statistics.backfill-enabled=${STATISTICS_BACKFILL_ENABLED:false}

# Uploaded pictures can be up to 5 MB (the app also checks this); the request limit leaves room for form overhead.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Return errors as JSON with a readable 'detail' message (for example the duplicate-game text) that the frontend shows.
spring.mvc.problemdetails.enabled=true
