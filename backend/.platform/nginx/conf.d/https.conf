server {
    listen 443 ssl;
    server_name api-dev.swampdragoninn.casa;

    ssl_certificate /etc/letsencrypt/live/api-dev.swampdragoninn.casa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.swampdragoninn.casa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:api_tls:10m;
    ssl_session_timeout 1d;
    client_max_body_size 6m;

    include conf.d/elasticbeanstalk/*.conf;
}
